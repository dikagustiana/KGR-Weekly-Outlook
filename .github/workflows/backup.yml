name: Backup

# Daily pg_dump of the Supabase database (schema + data), and on demand before every `supabase db push` to production
# (docs/PLAN-v3.md §0). Secrets (repository settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL            required — postgresql://… connection string (session pooler, port 5432)
#   SUPABASE_URL               optional — https://<ref>.supabase.co, to copy the dump to the private bucket "backups"
#   SUPABASE_SERVICE_ROLE_KEY  optional — service role key for that upload
# Without SUPABASE_DB_URL the job only prints a warning. The dump is also kept as a private workflow artifact (14 days).

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 WIB
  workflow_dispatch:
    inputs:
      reason:
        description: "Alasan (mis. sebelum db push F1)"
        required: false
        default: "manual"

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secret
        id: chk
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::warning::SUPABASE_DB_URL belum diisi — backup dilewati"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Install pg_dump 17
        if: steps.chk.outputs.skip != '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump
        if: steps.chk.outputs.skip != '1'
        id: dump
        run: |
          set -euo pipefail
          name="kgr-$(date -u +%Y%m%dT%H%M%SZ).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage --file="$name"
          sha256sum "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload to private bucket "backups"
        if: steps.chk.outputs.skip != '1' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          set -euo pipefail
          f="${{ steps.dump.outputs.name }}"
          curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/backups/$f" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" --data-binary "@$f" >/dev/null
          echo "uploaded backups/$f"
      - name: Keep as artifact
        if: steps.chk.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.name }}
          path: |
            ${{ steps.dump.outputs.name }}
            ${{ steps.dump.outputs.name }}.sha256
          retention-days: 14
