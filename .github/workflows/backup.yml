name: Backup

# Daily pg_dump of the Supabase database (schema + data), and on demand before every `supabase db push` to production
# (docs/PLAN-v3.md §0). Secrets (repository settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL            required — postgresql://… connection string (session pooler, port 5432)
#   SUPABASE_URL               optional — https://<ref>.supabase.co, to copy the dump to the private bucket "backups"
#   SUPABASE_SERVICE_ROLE_KEY  optional — service role key for that upload
# Without SUPABASE_DB_URL the job only prints a warning. The repository is public, and workflow artifacts of a public
# repository can be downloaded by any GitHub user: the dump (auth users included) is therefore never an artifact. It goes
# to the private bucket only; without SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY the job fails instead of keeping it.
# Only the sha256 line is kept as an artifact (no data).

# Also called by db-ops.yml (workflow_call) before a bundle goes into KGR-OS: the caller gets the dump's name, size and
# sha256, and stops when there is no dump (skipped = 1). Next to the dump the bucket keeps <name>.counts.tsv (rows per
# public table at dump time, no data) for the restore test (db-ops restore-test, T23).

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 WIB
  workflow_dispatch:
    inputs:
      reason:
        description: "Alasan (mis. sebelum db push F1)"
        required: false
        default: "manual"
  workflow_call:
    inputs:
      reason:
        type: string
        required: false
        default: "db-ops"
    outputs:
      name:
        value: ${{ jobs.dump.outputs.name }}
      bytes:
        value: ${{ jobs.dump.outputs.bytes }}
      sha256:
        value: ${{ jobs.dump.outputs.sha256 }}
      skipped:
        value: ${{ jobs.dump.outputs.skipped }}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.dump.outputs.name }}
      bytes: ${{ steps.dump.outputs.bytes }}
      sha256: ${{ steps.dump.outputs.sha256 }}
      skipped: ${{ steps.chk.outputs.skip }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secret
        id: chk
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::warning::SUPABASE_DB_URL belum diisi — backup dilewati"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Install pg_dump 17
        if: steps.chk.outputs.skip != '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump
        if: steps.chk.outputs.skip != '1'
        id: dump
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          name="kgr-$(date -u +%Y%m%dT%H%M%SZ).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage --file="$name"
          sha256sum "$name" | tee "$name.sha256"
          # rows per public table at dump time (no data): the restore test compares the restored database with it
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -X -At -F $'\t' -v ON_ERROR_STOP=1 -c "
            select format('select %L, count(*) from public.%I;', c.relname, c.relname) from pg_class c
             where c.relnamespace = 'public'::regnamespace and c.relkind = 'r' order by c.relname" \
            | /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -X -At -F $'\t' -v ON_ERROR_STOP=1 > "$name.counts.tsv"
          echo "tables counted: $(wc -l < "$name.counts.tsv")"
          {
            echo "name=$name"
            echo "bytes=$(stat -c %s "$name")"
            echo "sha256=$(cut -d' ' -f1 "$name.sha256")"
          } >> "$GITHUB_OUTPUT"
          echo "### Backup ${name}: $(stat -c %s "$name") byte, sha256 $(cut -d' ' -f1 "$name.sha256") (${REASON:-jadwal})" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to private bucket "backups"
        if: steps.chk.outputs.skip != '1'
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY belum diisi — dump tidak disimpan (repo publik: tidak boleh jadi artifact)"; exit 1
          fi
          f="${{ steps.dump.outputs.name }}"
          for x in "$f" "$f.counts.tsv"; do
            curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/backups/$x" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/octet-stream" --data-binary "@$x" >/dev/null
            echo "uploaded backups/$x"
          done
      - name: Remove the dump from the runner
        if: always() && steps.dump.outputs.name != ''
        run: rm -f "${{ steps.dump.outputs.name }}" "${{ steps.dump.outputs.name }}.counts.tsv"
      - name: Keep the checksum (no data)
        if: steps.chk.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.name }}.sha256
          path: ${{ steps.dump.outputs.name }}.sha256
          retention-days: 14
