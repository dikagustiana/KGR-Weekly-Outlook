name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Golden tests (fail on any mismatch > Rp 1 or > 0,01 kg)
        run: pnpm test
      - name: Parity report is up to date
        run: |
          pnpm parity
          git diff --exit-code -- docs/parity.md docs/parity-cells.csv
      - name: Snapshot of the example week is unchanged (SHA-256 947ce203…a83)
        run: pnpm snapshot:diff
      - name: CLI smoke test
        run: pnpm outlook --week 2026-08-24 --today 2026-08-27 --blocks 1-7
      - name: Web app builds
        run: pnpm build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: K41 fail-closed reads
        run: bash scripts/lint-k41.sh
      - name: K42 pagination and chunking
        run: bash scripts/lint-k42.sh

  rls:
    # Migrations (run twice: idempotent), seed and role tests on a disposable PostgreSQL with a Supabase shim.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Role tests (supabase/tests/rls_roles.sql)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash scripts/test-rls.sh
